name: CI

# T1.5 (docs/audit/ADAPTED-PLAN.md): minimal, additive guardrails.
# Gates: backend tests, catalog drift test, frontend typecheck+build.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infracentra
          POSTGRES_PASSWORD: infracentra
          POSTGRES_DB: infracentra_pg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infracentra -d infracentra_pg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        # requirements.txt = runtime pins (pymisp==2.4.189.1 was NOT on PyPI ->
        # "Could not find a version that satisfies the requirement" broke CI).
        # Test tooling is installed explicitly here, kept out of runtime deps.
        run: |
          pip install -r backend/requirements.txt
          pip install pytest==7.4.4 pytest-asyncio==0.21.1 aiosqlite==0.22.1
      - name: Regenerate catalog and check drift (T1.2)
        # gen_catalog.py writes platform/catalog YAMLs from live code sources;
        # any uncommitted diff means seed/connectors/catalog drifted.
        run: |
          python backend/tools/gen_catalog.py --out backend/app/platform/catalog
          git add -A backend/app/platform/catalog
          # NOTE: `-q` belongs to git-diff, not to the shell; combining it with
          # --exit-code here previously produced exit 129 (usage error) on CI.
          if ! git diff --cached --quiet --exit-code; then
            echo "::error::platform catalog out of sync - run backend/tools/gen_catalog.py and commit"
            git diff --cached --stat
            exit 1
          fi
      - name: Run backend tests
        env:
          # async engine requires the aiosqlite driver ("sqlite+aiosqlite://");
          # plain sqlite:/// would fail at create_async_engine on CI only.
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          SECRET_KEY: ci-only-not-a-real-secret
          PG_TEST_URL: postgresql+asyncpg://infracentra:infracentra@localhost:5432/infracentra_pg_test
        # run from backend/ so pytest.ini (asyncio_mode=strict) is picked up;
        # -p no:libtmux mirrors the documented local invocation in tests/*.py
        working-directory: backend
        run: python -m pytest tests -q -p no:libtmux --durations=10

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
