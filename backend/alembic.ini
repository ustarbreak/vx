# Alembic configuration — InfraCentra backend
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# URL is overridden at runtime by migrations/env.py from
# settings.DATABASE_URL (or the ALEMBIC_DATABASE_URL env var).
# The value below is only a non-secret placeholder so that
# `alembic` tooling works without editing this file.
sqlalchemy.url = postgresql://infracentra:infracentra@localhost:5432/infracentra

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
